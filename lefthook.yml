# Hooks are intentionally cheap: only static checks on staged files.
# Tests run in CI (and via `pnpm test:affected` when you want them locally).
pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{js,ts,tsx,json,jsonc}"
      run: pnpm biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
