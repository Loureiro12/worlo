# Asserts a checkbox (by testID in ${ID}) is checked. Android exposes the
# `checked` attribute; iOS exposes the state in the accessibility value.
appId: com.worlo.app
---
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          id: ${ID}
          checked: true
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible:
          id: ${ID}
          text: ".*, checked"
