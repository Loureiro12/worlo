# Discovery + Share (02_SCREENS → E1, E2, J · 03_FLOWS → F7, F11).
# Explorar → Passeios → Tejo → supplier booking link; Perfil → Compartilhar.
appId: com.worlo.app
tags:
  - full
---
- runFlow: ../subflows/login.yaml

# E1 · Passeios (from "Passeios em destaque" → Ver todos)
- scrollUntilVisible:
    element:
      id: explore-tours-all
    direction: DOWN
- tapOn:
    id: explore-tours-all
- extendedWaitUntil:
    visible:
      id: passeios-screen
    timeout: 10000
- tapOn:
    id: passeios-filter-boat
- assertNotVisible:
    id: passeio-card-nata
- tapOn:
    id: passeio-card-tejo

# E2 · Detalhe: booking happens on the supplier's site (no booking inside Worlo).
# The seeded tours have no booking link yet, so the button says so.
- extendedWaitUntil:
    visible:
      id: passeio-screen
    timeout: 10000
- assertVisible: Pôr do sol de veleiro no Tejo
- assertNotVisible:
    id: passeio-date-0
- assertVisible:
    id: passeio-book
    text: Reserva pelo fornecedor em breve
- tapOn:
    id: header-back

# J · Compartilhar (Perfil → Compartilhar meu mundo)
- tapOn:
    id: tab-profile
- extendedWaitUntil:
    visible:
      id: profile-screen
    timeout: 10000
- tapOn:
    id: profile-share
- extendedWaitUntil:
    visible:
      id: share-screen
    timeout: 10000
# The preview is a single accessible image: check it rendered.
- assertVisible:
    id: share-preview
- tapOn:
    id: share-format-post
- tapOn:
    id: share-theme-coral
- tapOn:
    id: share-format-square
- tapOn:
    id: share-theme-sand
- tapOn:
    id: share-subject-map
- assertVisible:
    id: share-preview
- tapOn:
    id: share-format-story
- tapOn:
    id: share-theme-dark
- tapOn:
    id: share-dest-link
# Copy-link toast is covered by unit tests (animated globe keeps XCUITest busy).
- assertVisible:
    id: share-screen
- takeScreenshot: discovery-share
- tapOn:
    id: header-back
- extendedWaitUntil:
    visible:
      id: profile-screen
    timeout: 10000
