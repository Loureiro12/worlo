# Planejar e viajar (03_FLOWS → F6): Viagens › Roteiros › editor → adicionar
# parada → começar viagem → check-in → encerrar (cria viagem realizada).
appId: com.worlo.app
tags:
  - full
---
- runFlow: ../subflows/login.yaml
- tapOn:
    id: tab-trips
- tapOn:
    id: trips-seg-rot
- tapOn:
    id: rot-card-peru
- extendedWaitUntil:
    visible:
      id: roteiro-screen
    timeout: 10000
- assertVisible: Dia 1 · Lima → Cusco
# Adicionar atividade (end of the day) → a suggestion fills the form → save
- scrollUntilVisible:
    element:
      id: roteiro-add-stop
    direction: DOWN
    # Fully on screen, not behind the bottom bar.
    visibilityPercentage: 100
    centerElement: true
- tapOn:
    id: roteiro-add-stop
- assertVisible: Adicionar ao Dia 1
- tapOn:
    id: roteiro-sug-0
- tapOn:
    id: roteiro-sug-sheet-save
# The new stop goes to the end of the day, below the fold.
- scrollUntilVisible:
    element:
      text: ".*Mercado San Pedro.*"
    direction: DOWN
# Iniciar viagem → Começar agora → modo viagem
- tapOn:
    id: roteiro-start
- assertVisible: Quando a viagem começa?
- tapOn:
    id: roteiro-start-now
- extendedWaitUntil:
    visible:
      id: live-screen
    timeout: 10000
- assertVisible: Plano de hoje
# "+" adds anything to the day, typed freely
- tapOn:
    id: live-add
- tapOn:
    id: live-add-sheet-save
- assertVisible: Diga o que você vai fazer.
- tapOn:
    id: activity-title
- inputText: Casa da tia Rosa
- tapOn:
    id: live-add-sheet-save
- assertVisible: Casa da tia Rosa entrou no Dia .*
# Encerrar → viagem realizada
- tapOn:
    id: live-end
- assertVisible: Encerrar a viagem?
- tapOn:
    id: live-sheet-submit
- assertVisible: Viagem encerrada. O Peru acendeu no seu mapa.
- assertNotVisible:
    id: live-screen
