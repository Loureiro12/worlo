# Viagens: open a trip, log a shared expense, then register a past trip (F2, F5).
# testIDs are a contract with features/trips.
appId: com.worlo.app
tags:
  - smoke
  - full
---
- runFlow: ../subflows/login.yaml
- tapOn:
    id: tab-trips
- extendedWaitUntil:
    visible:
      id: trips-screen
    timeout: 10000

# Trip page › Gastos › Adicionar gasto
- tapOn:
    id: trip-card-floripa
- extendedWaitUntil:
    visible:
      id: trip-screen
    timeout: 10000
- scrollUntilVisible:
    element:
      id: trip-tab-money
    direction: DOWN
- tapOn:
    id: trip-tab-money
- scrollUntilVisible:
    element:
      id: trip-add-expense
    direction: DOWN
- tapOn:
    id: trip-add-expense
- assertVisible: Novo gasto
- tapOn:
    id: expense-amount
- inputText: "210"
- tapOn:
    id: expense-name
- inputText: Sequencia de camarao
- tapOn: "Novo gasto" # dismisses the keyboard (non-interactive title)
# Everyone takes part by default; João sat this one out, Marina paid.
- assertVisible: Fica R\$ 70 pra cada um \(3 pessoas\)
- tapOn:
    id: expense-split-João
- assertVisible: Fica R\$ 105 pra cada um \(2 pessoas\)
- tapOn:
    id: expense-payer-Marina
- tapOn:
    id: expense-save
- assertVisible: "Gasto salvo. Fica R\\$ 105 pra cada: Você e Marina."
# Divisão: who pays whom
- scrollUntilVisible:
    element:
      id: trip-split
    direction: DOWN
- scrollUntilVisible:
    element:
      text: Sequencia de camarao
    direction: DOWN

# Viagens › + › Viagem que já aconteceu › Cadastro
- tapOn:
    id: header-back
- tapOn:
    id: trips-add
- tapOn:
    id: add-trip-past
# Destination search (offline GeoNames): type, pick the city
- tapOn:
    id: trip-form-dest
- inputText: Kyoto
- tapOn:
    id: trip-form-dest-option-0
- assertVisible:
    id: trip-form-dest
    text: Quioto, Japão
- tapOn:
    id: trip-form-name
- inputText: Cerejeiras em Kyoto
- tapOn: "Conta uma viagem que você fez" # dismisses the keyboard (non-interactive title)
- tapOn:
    id: trip-form-save
- extendedWaitUntil:
    visible:
      id: trips-screen
    timeout: 10000
# Trip cards are one accessible element: match inside the label.
- assertVisible: ".*Cerejeiras em Kyoto.*"
