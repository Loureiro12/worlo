appId: com.worlo.app
name: Local changes reach Supabase (written offline on Android)
tags:
  - sync
env:
  SUPABASE_URL: ${SUPABASE_URL || 'http://127.0.0.1:56321'}
---
- runFlow: ../subflows/launch-clean.yaml
- extendedWaitUntil:
    visible:
      id: sync-status
      text: Synced|Sincronizado
    timeout: 20000

# Android can cut the network; iOS simulators can't, so there the task is
# written online and the flow checks the round trip only.
- runFlow:
    when:
      platform: Android
    commands:
      - setAirplaneMode: enabled
      - extendedWaitUntil:
          visible:
            id: sync-status
            text: Offline|Sin conexión
          timeout: 10000

- tapOn:
    id: new-task-input
- inputText: Written offline
- tapOn:
    id: add-task-button
- assertVisible: Written offline

- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          id: sync-pending
      - setAirplaneMode: disabled

- extendedWaitUntil:
    notVisible:
      id: sync-pending
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: sync-status
      text: Synced|Sincronizado
    timeout: 10000

- runScript:
    file: ../scripts/count-remote-tasks.js
    env:
      TITLE: Written offline
- assertTrue: ${output.remoteCount >= 1}
