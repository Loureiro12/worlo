appId: com.worlo.app
name: Tasks work fully offline and persist across restarts
tags:
  - smoke
---
- runFlow: ../subflows/launch-clean.yaml
- assertVisible:
    id: tasks-empty

# Validation
- tapOn:
    id: add-task-button
- assertVisible:
    id: new-task-input-error

# Create
- tapOn:
    id: new-task-input
- inputText: Buy milk
- tapOn:
    id: add-task-button
- assertVisible: Buy milk
- assertNotVisible:
    id: tasks-empty

# Complete
- tapOn:
    id: task-toggle-Buy milk
- runFlow:
    file: ../subflows/assert-checked.yaml
    env:
      ID: task-toggle-Buy milk

# Persist (restart without clearing state)
- runFlow: ../subflows/relaunch.yaml
- assertVisible: Buy milk
- runFlow:
    file: ../subflows/assert-checked.yaml
    env:
      ID: task-toggle-Buy milk

# Delete
- tapOn:
    id: task-delete-Buy milk
- assertVisible:
    id: tasks-empty
