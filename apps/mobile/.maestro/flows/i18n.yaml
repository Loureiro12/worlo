appId: com.worlo.app
name: Language switches at runtime and is remembered
tags:
  - smoke
---
- runFlow: ../subflows/launch-clean.yaml

# Runtime switch: the current screen re-renders in the new language.
- tapOn:
    id: open-settings
- tapOn:
    id: language-es
- assertVisible: Ajustes
- assertVisible: Idioma

# Persisted: after a restart the home screen is still in Spanish.
- runFlow: ../subflows/relaunch.yaml
- assertVisible: Tareas

- tapOn:
    id: open-settings
- tapOn:
    id: language-en
- assertVisible: Settings
- runFlow: ../subflows/relaunch.yaml
- assertVisible: Tasks
