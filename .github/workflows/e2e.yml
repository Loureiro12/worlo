name: E2E

# Keeps E2E off the critical path:
#   * PRs run only `smoke` flows, and only when the app or its packages change.
#   * main and the nightly run every flow (tag `full`). The app is visual-only
#     for now (mock data), so no backend is started.
#   * The native binary is cached by its Expo fingerprint. JS-only changes are
#     repacked into the cached binary in seconds instead of a full Gradle build.
on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - "packages/**"
      - "pnpm-lock.yaml"
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FULL_SUITE: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
      - run: pnpm install --frozen-lockfile

      - name: Native fingerprint
        id: fingerprint
        working-directory: apps/mobile
        run: echo "hash=$(pnpm --silent e2e:fingerprint android)" >> "$GITHUB_OUTPUT"

      - name: Restore native build
        uses: actions/cache@v4
        with:
          path: apps/mobile/e2e-artifacts/android-${{ steps.fingerprint.outputs.hash }}.apk
          key: e2e-android-${{ steps.fingerprint.outputs.hash }}

      - name: Build (full native build or JS repack)
        working-directory: apps/mobile
        run: pnpm e2e:build android

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run Maestro
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: apps/mobile
          script: |
            adb install -r e2e-artifacts/android-latest.apk
            maestro test .maestro --format junit --output e2e-artifacts/report.xml --test-output-dir e2e-artifacts/maestro ${{ env.FULL_SUITE == 'true' && '--include-tags=full' || '--include-tags=smoke' }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maestro-android
          path: |
            apps/mobile/e2e-artifacts/report.xml
            apps/mobile/e2e-artifacts/maestro
